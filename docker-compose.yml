
services:
  db-container:
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - my_network

  api-container:
    build: .
    container_name: fastapi_backend
    command: uvicorn FastAPI_in_pipeline_container:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db-container
    networks:
      - my_network
    environment:
      DB_HOST: db-container
      STREAMLIT_CONNECTIONS_POSTGRESQL_USERNAME: ${POSTGRES_USER}
      STREAMLIT_CONNECTIONS_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      STREAMLIT_CONNECTIONS_POSTGRESQL_DATABASE: ${POSTGRES_DB}

  streamlit-app:
    build: .
    image: coders_end_localandnew-streamlit-app
    container_name: streamlit_gui
    command: streamlit run gui_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - db-container
      - api-container
    networks:
      - my_network
    environment:
      BACKEND_URL: http://api-container:8000
      STREAMLIT_CONNECTIONS_POSTGRESQL_DIALECT: postgresql
      STREAMLIT_CONNECTIONS_POSTGRESQL_USERNAME: ${POSTGRES_USER}
      STREAMLIT_CONNECTIONS_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      STREAMLIT_CONNECTIONS_POSTGRESQL_DATABASE: ${POSTGRES_DB}
      STREAMLIT_CONNECTIONS_POSTGRESQL_HOST: db-container
      STREAMLIT_CONNECTIONS_POSTGRESQL_PORT: 5432

  pgadmin-container:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "8080:80"
    depends_on:
      - db-container
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
