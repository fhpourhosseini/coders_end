services:
  db-container:
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5  

  fastapi-container:
    build:
      context: .
      dockerfile: Dockerfile.api 
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    depends_on:
       db-container:
         condition: service_healthy
    environment:
      - STREAMLIT_CONNECTIONS_POSTGRESQL_USERNAME=${POSTGRES_USER}
      - STREAMLIT_CONNECTIONS_POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - STREAMLIT_CONNECTIONS_POSTGRESQL_DATABASE=${POSTGRES_DB}
      - STREAMLIT_CONNECTIONS_POSTGRESQL_HOST=db-container
      - STREAMLIT_CONNECTIONS_POSTGRESQL_PORT=5432

  streamlit-app:
    build: .
    container_name: streamlit_gui
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-container
    environment:
      - FASTAPI_URL=http://fastapi-container:8000

  pgadmin-container:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "8080:80"
    depends_on:
      - db-container
    volumes:
      - pgadmin_data:/pgadmin4/servers.json
      - ./servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  pgadmin_data:
